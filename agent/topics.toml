  "get_contract_data:data.balanceData.available_amount",
  "get_region_limits:data.result.limit_type",
  "get_restrictions:data.result.restriction_type",
]
notes = "Порядок: статус → check_purchase → лимит → баланс → регион и ограничитель → PIN. Код из чека — по таблице Приложения № 4."
  [[topic.params]]
  kind = "card"
  required = true
  ask = "По какой карте отказ? Номер, ID или комментарий."
  [[topic.params]]
  kind = "decline_code"
  required = false
