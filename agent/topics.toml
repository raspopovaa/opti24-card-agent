examples = ["Сколько запросов к API у нас осталось в этом месяце, не заблокируют ли нас?", "Сколько запросов к API мы уже потратили?"]
keywords = ["запрос!", "api", "апи", "пакет", "квот!"]
tools = ["get_api_usage"]
answer_fields = ["get_info:data.client_info.Queries", "get_info:data.methods.all", "get_info:data.client_info.PricePlan"]
notes = "Тариф Free — 500 запросов в месяц, затем доступ приостанавливается до конца месяца."

[[topic]]
id = "account"
section = "reference"
title = "Роль и режим"
goal = "Узнать свою роль, режим работы и договоры"
examples = ["Какая у меня роль и режим работы?", "Что ты умеешь?", "Какие у меня договоры?"]
keywords = ["роль!", "режим", "умеешь!", "можешь", "договоры!"]
tools = ["get_account_context"]
answer_fields = ["auth_user:data.role_name", "auth_user:data.read_only", "auth_user:data.contracts.number"]
notes = "Изменения возможны только при changes_enabled (режим confirm и право записи аккаунта)."

[[topic]]
id = "contract_terms"
section = "reference"
title = "Условия договора"
goal = "Узнать условия договора: возврат аванса, сроки документов, претензии, блокировка"
examples = [
  "Как нам вернуть неиспользованный аванс, если расторгаем договор?",
  "До какого числа нужно вернуть подписанные закрывающие документы?",
  "Как подать претензию по качеству топлива?",
]
keywords = ["аванс!", "растор!", "до какого числа!", "нужно вернуть", "претенз!", "условия", "качеств"]
tools = ["lookup_knowledge"]
answer_fields = []
notes = "Только по выжимкам договора; пункт и редакция; без юридических гарантий."

[[topic]]
id = "dictionaries"
section = "reference"
title = "Справочники"
goal = "Узнать, что значит код или какие бывают значения: статусы, схемы скидок, условия оплаты, услуги АЗС"
examples = ["Какие бывают статусы карт?", "Что значит схема скидки в договоре?", "Какие услуги бывают на АЗС?", "Какие офисы продаж есть?"]
keywords = ["справочник!", "какие бывают", "что значит", "что означает", "схема скидки", "услуг!", "офис!", "статусы", "статус"]
tools = ["lookup_dictionary"]
answer_fields = ["get_dictionary:data.result.name", "get_dictionary:data.result.code"]
dictionaries = ["CardStatus", "ContractStatus", "DiscountScheme", "PaymentTerm", "PaymentScheme", "Services", "Office", "POIPartner", "POIType", "Goods", "ProductType", "Region"]
notes = "Справочники бесплатны; агент сам расшифровывает ими коды в сводке договора, лимитах и регионах."

