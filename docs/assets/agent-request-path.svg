<svg xmlns="http://www.w3.org/2000/svg" width="820" height="604" viewBox="0 0 820 604" role="img" aria-label="Путь запроса клиента в семь шагов: вопрос, классификатор, тема, инструменты, проверки, SDK и API, ответ. Шаги выполняет код, тему при неуверенности и текст ответа — модель."><title>Путь запроса клиента</title><style>.t{font-family:Lora,Georgia,serif;font-size:13px;fill:#6b6a63} .h{font-family:Poppins,'Helvetica Neue',Arial,sans-serif;font-size:14px;font-weight:600;fill:#141413} .big{font-family:Poppins,'Helvetica Neue',Arial,sans-serif;font-size:18px;font-weight:600;fill:#141413} .c{font-family:Poppins,'Helvetica Neue',Arial,sans-serif;font-size:11px;font-weight:600}</style><rect width="820" height="604" rx="14" fill="#faf9f5" stroke="#d8d5c8"/><text x="24" y="38" class="big">Путь запроса клиента</text><text x="24" y="60" class="t">Что делает код, а что остаётся модели</text><line x1="40" y1="127" x2="40" y2="165" stroke="#d8d5c8" stroke-width="2"/><rect x="64" y="84" width="732" height="54" rx="10" fill="#ffffff" stroke="#d8d5c8"/><circle cx="40" cy="111" r="13" fill="#d97757"/><text x="40" y="116" text-anchor="middle" style="font-family:Poppins,'Helvetica Neue',Arial,sans-serif;font-size:13px;font-weight:600;fill:#fff">1</text><text x="80" y="108" class="h">Вопрос</text><text x="80" y="127" class="t">«Почему карта ****2323 не работает?» и сегодняшняя дата</text><rect x="722" y="94" width="60" height="20" rx="10" fill="#788c5d" fill-opacity=".16"/><text x="752.0" y="108" text-anchor="middle" class="c" style="fill:#788c5d">код</text><line x1="40" y1="189" x2="40" y2="227" stroke="#d8d5c8" stroke-width="2"/><rect x="64" y="146" width="732" height="54" rx="10" fill="#ffffff" stroke="#d8d5c8"/><circle cx="40" cy="173" r="13" fill="#d97757"/><text x="40" y="178" text-anchor="middle" style="font-family:Poppins,'Helvetica Neue',Arial,sans-serif;font-size:13px;font-weight:600;fill:#fff">2</text><text x="80" y="170" class="h">Классификатор</text><text x="80" y="189" class="t">сравнивает слова вопроса с ключевыми словами 26 тем</text><rect x="722" y="156" width="60" height="20" rx="10" fill="#788c5d" fill-opacity=".16"/><text x="752.0" y="170" text-anchor="middle" class="c" style="fill:#788c5d">код</text><line x1="40" y1="259" x2="40" y2="313" stroke="#d8d5c8" stroke-width="2"/><rect x="64" y="208" width="732" height="70" rx="10" fill="#ffffff" stroke="#d97757"/><circle cx="40" cy="243" r="13" fill="#d97757"/><text x="40" y="248" text-anchor="middle" style="font-family:Poppins,'Helvetica Neue',Arial,sans-serif;font-size:13px;font-weight:600;fill:#fff">3</text><text x="80" y="232" class="h">Тема</text><text x="80" y="251" class="t">«Отказ на АЗС», если баллов не меньше 2 и больше, чем у соседней темы.</text><text x="80" y="269" class="t">Иначе подсказки нет: тему выбирает модель по каталогу тем</text><rect x="698" y="218" width="84" height="20" rx="10" fill="#d97757" fill-opacity=".16"/><text x="740.0" y="232" text-anchor="middle" class="c" style="fill:#d97757">код / модель</text><line x1="40" y1="329" x2="40" y2="367" stroke="#d8d5c8" stroke-width="2"/><rect x="64" y="286" width="732" height="54" rx="10" fill="#ffffff" stroke="#d97757"/><circle cx="40" cy="313" r="13" fill="#d97757"/><text x="40" y="318" text-anchor="middle" style="font-family:Poppins,'Helvetica Neue',Arial,sans-serif;font-size:13px;font-weight:600;fill:#fff">4</text><text x="80" y="310" class="h">Инструменты</text><text x="80" y="329" class="t">открывается diagnose_fueling, остальные скрыты от модели</text><rect x="722" y="296" width="60" height="20" rx="10" fill="#788c5d" fill-opacity=".16"/><text x="752.0" y="310" text-anchor="middle" class="c" style="fill:#788c5d">код</text><line x1="40" y1="391" x2="40" y2="429" stroke="#d8d5c8" stroke-width="2"/><rect x="64" y="348" width="732" height="54" rx="10" fill="#ffffff" stroke="#d8d5c8"/><circle cx="40" cy="375" r="13" fill="#d97757"/><text x="40" y="380" text-anchor="middle" style="font-family:Poppins,'Helvetica Neue',Arial,sans-serif;font-size:13px;font-weight:600;fill:#fff">5</text><text x="80" y="372" class="h">Проверки</text><text x="80" y="391" class="t">имена аргументов, бюджет тарифицируемых запросов, режим read_only</text><rect x="722" y="358" width="60" height="20" rx="10" fill="#788c5d" fill-opacity=".16"/><text x="752.0" y="372" text-anchor="middle" class="c" style="fill:#788c5d">код</text><line x1="40" y1="453" x2="40" y2="491" stroke="#d8d5c8" stroke-width="2"/><rect x="64" y="410" width="732" height="54" rx="10" fill="#ffffff" stroke="#d8d5c8"/><circle cx="40" cy="437" r="13" fill="#d97757"/><text x="40" y="442" text-anchor="middle" style="font-family:Poppins,'Helvetica Neue',Arial,sans-serif;font-size:13px;font-weight:600;fill:#fff">6</text><text x="80" y="434" class="h">SDK и API</text><text x="80" y="453" class="t">4 тарифицируемых запроса к Opti24 через apisdkopti24</text><rect x="722" y="420" width="60" height="20" rx="10" fill="#788c5d" fill-opacity=".16"/><text x="752.0" y="434" text-anchor="middle" class="c" style="fill:#788c5d">код</text><rect x="64" y="472" width="732" height="54" rx="10" fill="#ffffff" stroke="#d8d5c8"/><circle cx="40" cy="499" r="13" fill="#d97757"/><text x="40" y="504" text-anchor="middle" style="font-family:Poppins,'Helvetica Neue',Arial,sans-serif;font-size:13px;font-weight:600;fill:#fff">7</text><text x="80" y="496" class="h">Ответ</text><text x="80" y="515" class="t">суммы считает код, модель пишет короткую сводку и называет период</text><rect x="722" y="482" width="60" height="20" rx="10" fill="#6a9bcc" fill-opacity=".16"/><text x="752.0" y="496" text-anchor="middle" class="c" style="fill:#6a9bcc">модель</text><text x="24" y="556" class="t">Тарифицируемые запросы идут только на шаге 6. Неизвестный аргумент отклоняется на шаге 5, до запроса.</text><text x="24" y="578" class="t">Если не хватает карты или периода, агент сначала спрашивает пользователя.</text></svg>