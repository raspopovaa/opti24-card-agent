# Матрица тем: запрос клиента → тема → инструменты агента → данные из ответов SDK → что спросить.
#
# Как пополнять: возьмите реальный вопрос клиента (журнал AGENT_TOPIC_LOG), добавьте его в
# examples подходящей темы или заведите новую тему, допишите keywords и запустите pytest:
# тест проверит, что каждый пример попадает в свою тему, инструменты существуют, а поля
# answer_fields есть в моделях ответа SDK. Затем обновите docs/topic-matrix.md:
#     python scripts/generate_topic_matrix.py
#
# Разделы ([[section]]) группируют темы: модель может открыть весь раздел, если сомневается
# между его темами.
#
# Поля темы:
#   id, title, goal     — ключ, название темы и цель клиента своими словами;
#   section             — раздел из [[section]];
#   examples            — реальные формулировки (тест: каждая попадает в эту тему);
#   keywords            — начала слов в нижнем регистре («ё» как «е»): слово весит 1, фраза из
#                         нескольких слов ищется целиком и весит 2, «!» в конце добавляет 1;
#                         подсказка даётся, только если сумма главной темы не меньше 2 и строго
#                         больше, чем у следующей: многозначные слова («счёт», «заправка») — без «!»,
#                         точные («баланс», «платёж») — с «!», чтобы одного совпадения хватало;
#   tools               — инструменты агента в порядке вызова;
#   answer_fields       — «операция SDK:путь поля» в модели ответа, из которых берётся ответ;
#   dictionaries        — справочники API (get_dictionary), которыми код расшифровывает коды в ответе;
#   supported = false   — агент этого не делает: reply объясняет почему и что делать;
#   [[topic.params]]    — что нужно для ответа: kind (period, card, product, station, liters,
#                         decline_code, transaction_id, reason, amount, region), required,
#                         default (current_month) или ask — вопрос пользователю, если не указано.

[[section]]
id = "money"
title = "Деньги и договор"
summary = "баланс, платежи, счета и закрывающие документы"

[[section]]
id = "spending"
title = "Расходы и цены"
summary = "расходы, цена топлива, скидка, регионы, заправки, подозрительные"

[[section]]
id = "cards"
title = "Карты"
summary = "поиск карт, водитель, блокировка, комментарий"

[[section]]
id = "rules"
title = "Правила заправки"
summary = "лимиты, региональные правила, ограничители и их изменение"

[[section]]
id = "refusals"
title = "Отказы на АЗС"
summary = "почему карту не приняли, разбор по чеку"

[[section]]
id = "reports"
title = "Отчёты"
summary = "заказ, статус и скачивание отчётов"

[[section]]
id = "reference"
title = "Условия, справочники и доступ"
summary = "условия договора, справочники, роль, пакет запросов API"

[[section]]
id = "outside"
title = "Вне задач агента"
summary = "переводы денег, заказ карт, расход на 100 км, посторонние вопросы"

[[topic]]
id = "balance"
section = "money"
title = "Баланс договора"
goal = "Узнать, сколько денег осталось на договоре и хватит ли их"
examples = ["Сколько денег осталось на договоре?", "Какой у нас баланс?", "Хватит ли денег до конца месяца?"]
keywords = ["баланс!", "остат", "деньг", "денег", "хватит", "средств", "доступн", "на счету", "закончатся", "кончатся"]
dictionaries = ["DiscountScheme", "PaymentTerm", "PaymentScheme"]
tools = ["get_contract_summary"]
answer_fields = [
  "get_contract_data:data.balanceData.available_amount",
  "get_contract_data:data.balanceData.own_balance",
  "get_contract_data:data.balanceData.consumption_for_month",
  "get_contract_data:data.balanceData.last_payment_sum",
  "get_contract_data:data.balanceData.last_payment_date",
]
notes = "«Доступно» — available_amount; лимитные поля договора не путать с остатком денег. Прогноз — только по просьбе."

