  "get_transactions_v2:data.result.qty",
  "get_transactions_v2:data.result.product_name",
  "get_transactions_v2:data.result.card_id",
]
notes = "Операции видны через 1–2 часа после заправки. Период больше месяца делится на месяцы."
  [[topic.params]]
  kind = "period"
  required = true
  default = "current_month"

