  "Водителю не дали заправиться по карте c1, в чеке код ответа 51. Что случилось?",
]
keywords = ["отказ!", "отказал", "отказали", "чек", "не работает!", "не проходит!", "не приняли!", "не принимает!", "не дали!", "не прошла!", "пин", "pin"]
