<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-label="Как агент отвечает на вопрос: 1 — вопрос с текущей датой; 2 — модель выбирает инструмент по инструкции и схемам; 3 — предохранители проверяют бюджет платных запросов, остаток пакета и режим; 4 — запрос к API Opti24; 5 — расчёт кодом в Decimal; 6 — короткая сводка возвращается модели; 7 — ответ клиенту, изменения только с подтверждением человека">
<style>
@keyframes walk {
  0.0%,10.0% { transform: translateY(0px) }
  14.29%,24.29% { transform: translateY(72px) }
  28.57%,38.57% { transform: translateY(144px) }
  42.86%,52.86% { transform: translateY(216px) }
  57.14%,67.14% { transform: translateY(288px) }
  71.43%,81.43% { transform: translateY(360px) }
  85.71%,95.71% { transform: translateY(432px) }
  95.71%,100% { transform: translateY(432px) }
}
@keyframes lit { 0% { fill: #2dd4bf } 13.79% { fill: #2dd4bf } 14.29%,100% { fill: #0d1117 } }
@keyframes litnum { 0% { fill: #0d1117 } 13.79% { fill: #0d1117 } 14.29%,100% { fill: #2dd4bf } }
@keyframes band { 0% { opacity: .12 } 13.79% { opacity: .12 } 14.29%,100% { opacity: 0 } }
@keyframes flow { to { stroke-dashoffset: -14 } }
.cursor { animation: walk 14s ease-in-out infinite }
.dot { animation: lit 14s linear infinite }
.dotnum { animation: litnum 14s linear infinite }
.band { animation: band 14s linear infinite; opacity: 0 }
.line { animation: flow .8s linear infinite }
.r0 { animation-delay: 0s }
.r1 { animation-delay: 2s }
.r2 { animation-delay: 4s }
.r3 { animation-delay: 6s }
.r4 { animation-delay: 8s }
.r5 { animation-delay: 10s }
.r6 { animation-delay: 12s }
@media (prefers-reduced-motion: reduce) {
  .cursor, .dot, .dotnum, .band, .line { animation: none }
  .cursor { display: none }
  .band { opacity: .06 }
}
</style>
<rect width="900" height="650" rx="14" fill="#0d1117"/>
<text x="40" y="48" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#e6edf3">Как агент отвечает на вопрос</text>
<text x="40" y="76" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e">Модель выбирает инструменты, код считает, предохранители охраняют деньги и пакет запросов</text>
<line x1="70" y1="130" x2="70" y2="562" stroke="#30363d" stroke-width="2"/>
<line class="line" x1="70" y1="130" x2="70" y2="562" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="4 10" opacity=".55"/>
<rect class="band r0" x="36" y="99" width="828" height="62" rx="10" fill="#2dd4bf"/>
<circle class="dot r0" cx="70" cy="130" r="17" fill="#0d1117" stroke="#2dd4bf" stroke-width="2"/>
<text class="dotnum r0" x="70" y="136" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2dd4bf">1</text>
<text x="108" y="127" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#e6edf3">Вопрос</text>
<text x="108" y="149" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">«Сколько потратили в прошлом месяце?» и текущая дата в сообщении</text>
<rect x="672" y="115" width="188" height="30" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="766" y="135" text-anchor="middle" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="12" fill="#7ee3d6">agent/core.py</text>
<rect class="band r1" x="36" y="171" width="828" height="62" rx="10" fill="#2dd4bf"/>
<circle class="dot r1" cx="70" cy="202" r="17" fill="#0d1117" stroke="#2dd4bf" stroke-width="2"/>
<text class="dotnum r1" x="70" y="208" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2dd4bf">2</text>
<text x="108" y="199" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#e6edf3">Модель выбирает инструмент</text>
<text x="108" y="221" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">Инструкция и схемы 27 инструментов, выбор: spending_report(даты)</text>
<rect x="672" y="187" width="188" height="30" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="766" y="207" text-anchor="middle" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="12" fill="#7ee3d6">agent/prompt.py</text>
<rect class="band r2" x="36" y="243" width="828" height="62" rx="10" fill="#2dd4bf"/>
<circle class="dot r2" cx="70" cy="274" r="17" fill="#0d1117" stroke="#2dd4bf" stroke-width="2"/>
<text class="dotnum r2" x="70" y="280" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2dd4bf">3</text>
<text x="108" y="271" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#e6edf3">Предохранители</text>
<text x="108" y="293" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">Бюджет платных запросов, остаток пакета, режим read_only, период ≤ месяца</text>
<rect x="672" y="259" width="188" height="30" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="766" y="279" text-anchor="middle" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="12" fill="#7ee3d6">agent/safety.py</text>
<rect class="band r3" x="36" y="315" width="828" height="62" rx="10" fill="#2dd4bf"/>
<circle class="dot r3" cx="70" cy="346" r="17" fill="#0d1117" stroke="#2dd4bf" stroke-width="2"/>
<text class="dotnum r3" x="70" y="352" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2dd4bf">4</text>
<text x="108" y="343" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#e6edf3">API Opti24</text>
<text x="108" y="365" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">Операции за период, страницы по 100: платный запрос, повтор из кеша</text>
<rect x="672" y="331" width="188" height="30" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="766" y="351" text-anchor="middle" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="12" fill="#7ee3d6">apisdkopti24</text>
<rect class="band r4" x="36" y="387" width="828" height="62" rx="10" fill="#2dd4bf"/>
<circle class="dot r4" cx="70" cy="418" r="17" fill="#0d1117" stroke="#2dd4bf" stroke-width="2"/>
<text class="dotnum r4" x="70" y="424" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2dd4bf">5</text>
<text x="108" y="415" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#e6edf3">Расчёт кодом</text>
<text x="108" y="437" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">Decimal: сумма, литры, цена литра, скидка, сервисный сбор; модель не считает</text>
<rect x="672" y="403" width="188" height="30" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="766" y="423" text-anchor="middle" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="12" fill="#7ee3d6">agent/analysis.py</text>
<rect class="band r5" x="36" y="459" width="828" height="62" rx="10" fill="#2dd4bf"/>
<circle class="dot r5" cx="70" cy="490" r="17" fill="#0d1117" stroke="#2dd4bf" stroke-width="2"/>
<text class="dotnum r5" x="70" y="496" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2dd4bf">6</text>
<text x="108" y="487" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#e6edf3">Короткая сводка</text>
<text x="108" y="509" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">Модель получает JSON на десяток строк, а не сотни операций</text>
<rect x="672" y="475" width="188" height="30" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="766" y="495" text-anchor="middle" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="12" fill="#7ee3d6">agent/tools/</text>
<rect class="band r6" x="36" y="531" width="828" height="62" rx="10" fill="#2dd4bf"/>
<circle class="dot r6" cx="70" cy="562" r="17" fill="#0d1117" stroke="#2dd4bf" stroke-width="2"/>
<text class="dotnum r6" x="70" y="568" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2dd4bf">7</text>
<text x="108" y="559" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#e6edf3">Ответ</text>
<text x="108" y="581" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">Вывод в 1–2 фразы, период и цифры; изменения — только с подтверждением</text>
<rect x="672" y="547" width="188" height="30" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="766" y="567" text-anchor="middle" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="12" fill="#7ee3d6">agent/core.py</text>
<g class="cursor"><circle cx="70" cy="130" r="7" fill="#2dd4bf"/><circle cx="70" cy="130" r="12" fill="none" stroke="#2dd4bf" stroke-opacity=".4"/></g>
<text x="40" y="624" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">Платные запросы ограничены бюджетом сессии и остатком пакета · Изменения — только в режиме confirm и с подтверждением человека</text>
</svg>
